<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bethelincovibe TV - Business Information & Marketplace for Lagos Entrepreneurs</title>
    <meta name="description" content="Bethelincovibe TV provides startup guides, the Lagos business directory, verified supplier marketplace, masterclasses, and growth tools for Nigerian entrepreneurs." />
    <meta name="keywords" content="Lagos business directory, Nigerian entrepreneurs, startup guides, business funding, Lagos suppliers, SME marketing, Bethelincovibe TV" />
    <meta name="author" content="Bethelincovibe TV" />

    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- Professional Graphic Design Fonts: Plus Jakarta Sans, Playfair Display, Outfit, Syne, Montserrat, Cinzel -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@500;700;800;900&family=Outfit:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

    <!-- Open Graph / WhatsApp / Facebook / LinkedIn / Social Cards -->
    <meta property="og:site_name" content="Bethelincovibe TV" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:title" content="Bethelincovibe TV - Business Information & Marketplace for Lagos Entrepreneurs" />
    <meta property="og:description" content="Discover startup guides, verified Lagos suppliers, business directories, courses, and AI growth tools for Nigerian entrepreneurs." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:alt" content="Bethelincovibe TV - Lagos Business Platform" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@bethelincovibetv" />
    <meta name="twitter:title" content="Bethelincovibe TV - Business Information & Marketplace" />
    <meta name="twitter:description" content="Startup guides, the Lagos business directory, verified suppliers, and growth tools for Nigerian entrepreneurs." />
    <meta name="twitter:image" content="/logo.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Bethelincovibe TV",
      "description": "Business information platform for Lagos entrepreneurs",
      "url": "https://bethelincovibetv.com",
      "logo": "/logo.png",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Lagos",
        "addressCountry": "NG"
      }
    }
    </script>

    <!-- OneSignal Web Push SDK (load before app scripts so init can attach immediately) -->
    <script>window.OneSignalDeferred = window.OneSignalDeferred || [];</script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" async></script>

    <!-- Google Identity Services (GSI) for Google Contacts & People API Integration -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body class="bg-[#0c0817]">
    <div id="root">
      <div id="initial-boot-splash" style="position:fixed;inset:0;background-color:#0c0817;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#ffffff;user-select:none;text-align:center;padding:16px;">
        <div style="position:relative;margin-bottom:28px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,0.35) 0%,rgba(236,72,153,0.2) 60%,transparent 100%);filter:blur(20px);"></div>
          <div style="position:relative;width:96px;height:96px;border-radius:24px;background:linear-gradient(180deg,#20153b 0%,#120a24 100%);padding:12px;box-shadow:0 20px 50px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;">
            <img src="/logo.png" alt="Bethelincovibe TV" style="width:100%;height:100%;object-fit:contain;border-radius:16px;" />
          </div>
        </div>
        <div style="font-size:22px;font-weight:900;letter-spacing:-0.5px;margin-bottom:6px;background:linear-gradient(90deg,#ffffff 0%,#f3e8ff 60%,#fce7f3 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Bethelincovibe TV</div>
        <div style="font-size:13px;font-weight:500;color:rgba(233,213,255,0.75);margin-bottom:24px;">Lagos Business & Promotion Ecosystem</div>
        <div style="width:180px;height:4px;background:rgba(255,255,255,0.1);border-radius:999px;overflow:hidden;position:relative;">
          <div style="width:40%;height:100%;background:linear-gradient(90deg,#9333ea,#ec4899);border-radius:999px;animation:bootProgress 1.2s ease-in-out infinite alternate;"></div>
        </div>
      </div>
      <style>
        @keyframes bootProgress {
          0% { transform: translateX(-50%); width: 30%; }
          100% { transform: translateX(250%); width: 45%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
