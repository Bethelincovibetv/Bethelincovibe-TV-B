name: Harden promoter production storage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[storage-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove promoter/promotion local persistence fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')

          # Promotion orders: DB only; never fabricate an order in browser storage.
          p = root / 'src/services/promotionOrderService.ts'
          s = p.read_text()
          s = re.sub(r'\n  // Local storage fallback for test environment & offline support\n.*?\n  return \{ order: localOrder, error: null \};\n', '\n  return { order: null, error: "Promotion order could not be persisted to the database." };\n', s, flags=re.S)
          s = re.sub(r'\n  const allOrders = getLocalOrders\(\);\n  const userOrders = allOrders\.filter\(\(o\) => o\.business_user_id === businessUserId\);.*?\n  return userOrders;\n', '\n  return [];\n', s, flags=re.S)
          s = re.sub(r'\n  const allOrders = getLocalOrders\(\);\n  const promoterOrders = allOrders\.filter\(\(o\) => o\.promoter_id === promoterId\);.*?\n  return promoterOrders;\n', '\n  return [];\n', s, flags=re.S)
          s = re.sub(r'\n  if \(!foundOrder\) \{\n    const allOrders = getLocalOrders\(\);\n    foundOrder = allOrders\.find\(\(o\) => o\.id === orderId\) \|\| null;\n  \}\n', '\n', s)
          s = re.sub(r'export function getLocalOrders\(\): PromotionOrder\[\] \{.*?\n\}\n\nexport function saveLocalOrders\(orders: PromotionOrder\[\]\) \{.*?\n\}\n', 'export function getLocalOrders(): PromotionOrder[] { return []; }\nexport function saveLocalOrders(_orders: PromotionOrder[]) { throw new Error("Local promotion-order persistence is disabled. Use Supabase."); }\n', s, flags=re.S)
          s = s.replace('if (!error && data && data.length > 0) {\n      return data;\n    }', 'if (!error) {\n      return data || [];\n    }')
          p.write_text(s)

          # Promotion reviews: DB only for read/write; no browser cache as source of truth.
          p = root / 'src/services/promotionReviewService.ts'
          s = p.read_text()
          s = re.sub(r'const REVIEWS_STORAGE_KEY = .*?;\nconst ORDERS_STORAGE_KEY = .*?;\nconst PROMOTER_STORAGE_KEY_PREFIX = .*?;\n', '', s)
          s = re.sub(r'export function getLocalReviews\(\): PromotionReview\[\] \{.*?\n\}\n\nexport function saveLocalReviews\(reviews: PromotionReview\[\]\) \{.*?\n\}\n\nexport function getLocalOrders\(\): PromotionOrder\[\] \{.*?\n\}\n\nexport function saveLocalOrders\(orders: PromotionOrder\[\]\) \{.*?\n\}\n', 'export function getLocalReviews(): PromotionReview[] { return []; }\nexport function saveLocalReviews(_reviews: PromotionReview[]) { throw new Error("Local review persistence is disabled. Use Supabase."); }\nexport function getLocalOrders(): PromotionOrder[] { return []; }\nexport function saveLocalOrders(_orders: PromotionOrder[]) { throw new Error("Local promotion-order persistence is disabled. Use Supabase."); }\n', s, flags=re.S)
          s = re.sub(r'\n  // 7\. Duplicate Submission Protection \(Database & Local Store\)\n  const allReviews = getLocalReviews\(\);\n  const existingReview = allReviews\.find\(\(r\) => r\.order_id === order\.id\);\n  if \(existingReview\) \{.*?\n  \}\n', '\n', s, flags=re.S)
          s = re.sub(r'\n  allReviews\.push\(newReview\);\n  saveLocalReviews\(allReviews\);\n', '\n  const { data: existingDbReview, error: existingDbReviewError } = await supabase.from("promotion_reviews").select("id").eq("order_id", order.id).maybeSingle();\n  if (existingDbReviewError) return { ok: false, error: existingDbReviewError.message };\n  if (existingDbReview) return { ok: false, error: "Duplicate review rejected: You have already reviewed this promotion order." };\n  const { error: reviewInsertError } = await supabase.from("promotion_reviews").insert(newReview);\n  if (reviewInsertError) return { ok: false, error: reviewInsertError.message };\n', s)
          s = re.sub(r'\n  const promoterReviews = allReviews\.filter\(\(r\) => r\.promoter_id === order\.promoter_id\);.*?\n  const avgRating = reviewCount > 0 \? Math\.round\(\(ratingSum / reviewCount\) \* 100\) / 100 : null;\n', '\n  const { data: promoterReviewsData } = await supabase.from("promotion_reviews").select("rating").eq("promoter_id", order.promoter_id);\n  const promoterReviews = (promoterReviewsData || []) as Array<{ rating: number }>;\n  const reviewCount = promoterReviews.length;\n  const ratingSum = promoterReviews.reduce((sum, r) => sum + r.rating, 0);\n  const avgRating = reviewCount > 0 ? Math.round((ratingSum / reviewCount) * 100) / 100 : null;\n', s)
          s = re.sub(r'\n      if \(promoter\.user_id\) \{\n        localStorage\.setItem\(.*?\n      \}\n', '\n', s, flags=re.S)
          s = re.sub(r'\n  const allOrders = getLocalOrders\(\);\n  const orderIdx = allOrders\.findIndex\(\(o\) => o\.id === order\.id\);\n  if \(orderIdx >= 0\) \{.*?\n  \}\n', '\n', s, flags=re.S)
          s = re.sub(r'const reviews = getLocalReviews\(\);\n  return reviews\.find\(\(r\) => r\.order_id === orderId\) \|\| null;', 'const { data } = await supabase.from("promotion_reviews").select("*").eq("order_id", orderId).maybeSingle();\n  return (data as PromotionReview | null) || null;', s)
          p.write_text(s)

          # Verification admin queue: DB only for communities/promoters/audits.
          p = root / 'src/services/communityVerificationService.ts'
          s = p.read_text()
          s = re.sub(r'const VERIFICATIONS_STORAGE_KEY_PREFIX = .*?;\nconst COMMUNITIES_STORAGE_KEY_PREFIX = .*?;\nconst PROMOTER_STORAGE_KEY_PREFIX = .*?;\n', '', s)
          s = re.sub(r'function isSchemaMissingError\(error: any\): boolean \{.*?\n\}\n', '', s, flags=re.S)
          s = re.sub(r'function getLocalAudits\(communityId: string\): CommunityVerificationAudit\[\] \{.*?\n\}\n\nfunction saveLocalAudit\(audit: CommunityVerificationAudit\): void \{.*?\n\}\n', 'function getLocalAudits(_communityId: string): CommunityVerificationAudit[] { return []; }\nfunction saveLocalAudit(_audit: CommunityVerificationAudit): void {}\n', s, flags=re.S)
          s = re.sub(r'function getAllLocalCommunitiesWithPromoters\(\): AdminCommunityQueueItem\[\] \{.*?\n\}\n', 'function getAllLocalCommunitiesWithPromoters(): AdminCommunityQueueItem[] { return []; }\n', s)
          s = re.sub(r'function updateLocalCommunityStatus\(.*?\n\}\n', 'function updateLocalCommunityStatus(..._args: any[]): void {}\n', s, flags=re.S)
          s = re.sub(r'if \(error\) \{.*?\n    \}\n\n    const communities', 'if (error) throw error;\n\n    const communities', s, flags=re.S)
          s = re.sub(r'\n    // Check local fallback\n    const local = getAllLocalCommunitiesWithPromoters\(\);.*?\n    return \[\];\n', '\n    return communities;\n', s, flags=re.S)
          s = re.sub(r'\} catch \(err: any\) \{\n    return filterLocalCommunities\(getAllLocalCommunitiesWithPromoters\(\), filters\);\n  \}', '} catch (err: any) { throw err; }', s)
          s = re.sub(r'if \(error\) \{\n      if \(isSchemaMissingError\(error\)\) \{\n        return getLocalAudits\(communityId\);\n      \}\n      return getLocalAudits\(communityId\);\n    \}', 'if (error) throw error;', s)
          s = re.sub(r'\n    const localLogs = getLocalAudits\(communityId\);.*?\n    return Array\.from\(mergedMap\.values\(\)\)\.sort\(.*?\n    \);', '\n    return logs.sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());', s, flags=re.S)
          p.write_text(s)
          PY
      - name: Verify and build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit hardening changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services
          if git diff --cached --quiet; then echo 'No source changes required'; exit 0; fi
          git commit -m 'fix: harden promoter production storage [storage-hardening]'
          git push
